services:
  web:
    build: .
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_HOST: db

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    env_file: .env
    environment:
      DATABASE_HOST: db

  celery:
    build: .
    command: celery -A config.celery worker -l info
    depends_on:
      - redis
      - db
    env_file: .env
    environment:
      DATABASE_HOST: db

  celery-beat:
    build: .
    command: celery -A config.celery beat -l info
    depends_on:
      - redis
      - db
    env_file: .env
    environment:
      DATABASE_HOST: db

volumes:
  postgres_data:
  redis_data: